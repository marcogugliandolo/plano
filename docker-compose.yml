# Plano · maqueta 3D, plano y paseo del piso
# Stack para Portainer: pega este fichero en Stacks > Add stack > Web editor.
#
# Al arrancar, el contenedor descarga la rama indicada del repositorio de GitHub
# y la sirve con nginx. Para actualizar: haz push a GitHub y reinicia el contenedor.
# Si GitHub no responde, sigue sirviendo la última copia descargada.
#
# Va en Servidor-Oracle y escucha en el puerto 3082 del servidor (3000 dentro del contenedor).
# Dominio: plano.marcogugliandolo.com
#
# Variables opcionales (Portainer > Environment variables):
#   PLANO_REPO    usuario/repositorio (por defecto marcogugliandolo/plano)
#   PLANO_BRANCH  rama (por defecto main)
#   GITHUB_TOKEN  solo si el repositorio es privado (token con permiso de lectura)

services:
  plano:
    image: nginx:1.27-alpine
    container_name: plano
    restart: unless-stopped
    ports:
      - "3082:3000"
    environment:
      REPO: ${PLANO_REPO:-marcogugliandolo/plano}
      BRANCH: ${PLANO_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: Europe/Madrid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WEB=/usr/share/nginx/html
        TMP=/tmp/plano
        rm -rf "$$TMP" && mkdir -p "$$TMP"

        fetch() {
          if [ -n "$$GITHUB_TOKEN" ]; then
            wget -q -T 30 --header "Authorization: Bearer $$GITHUB_TOKEN" \
              -O "$$TMP/src.tgz" "https://api.github.com/repos/$$REPO/tarball/$$BRANCH"
          else
            wget -q -T 30 -O "$$TMP/src.tgz" \
              "https://codeload.github.com/$$REPO/tar.gz/refs/heads/$$BRANCH"
          fi
        }

        if fetch && tar -xzf "$$TMP/src.tgz" -C "$$TMP"; then
          SRC=$$(find "$$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -f "$$SRC/app/index.html" ] && [ -f "$$SRC/nginx.conf" ]; then
            rm -rf "$$WEB"/* "$$WEB"/.plano-version
            cp -r "$$SRC/app/." "$$WEB/"
            cp "$$SRC/nginx.conf" /etc/nginx/conf.d/default.conf
            date '+%Y-%m-%d %H:%M:%S' > "$$WEB/.plano-version"
            echo "[plano] desplegado $$REPO@$$BRANCH"
          else
            echo "[plano] el repositorio no tiene app/index.html o nginx.conf"
          fi
        else
          echo "[plano] no se pudo descargar $$REPO@$$BRANCH"
        fi
        rm -rf "$$TMP"

        if [ ! -f "$$WEB/.plano-version" ]; then
          echo "[plano] no hay ninguna copia que servir; reintento en 15 s"
          sleep 15
          exit 1
        fi

        nginx -t && exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
