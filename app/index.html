<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maqueta del piso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: maqueta de arquitecto sobre mesa de dibujo. La casa ocupa toda la pantalla y los mandos flotan alrededor. */
:root{
  --mesa:#dfe4e6; --papel:#f6f7f6; --tinta:#1d2730; --tinta-2:#5a6873; --linea:#c3ccd1;
  --muro:#27323b; --lampara:#b87400; --lampara-suave:#f6e3b8; --vidrio:#3f8fb5;
  --suelo-madera:#efe2cc; --suelo-frio:#e6e8e6; --suelo-rojo:#f1dcd8;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --texto:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sombra:0 6px 24px rgba(29,39,48,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mesa:#141a1f; --papel:#20282f; --tinta:#eef2f4; --tinta-2:#a0aeb8; --linea:#3b4852;
  --muro:#dfe6ea; --lampara:#f5b83d; --lampara-suave:#4b3a14; --vidrio:#74c4e6;
  --suelo-madera:#33291d; --suelo-frio:#2a3036; --suelo-rojo:#3b2826;
  --sombra:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#141a1f; --papel:#20282f; --tinta:#eef2f4; --tinta-2:#a0aeb8; --linea:#3b4852;
  --muro:#dfe6ea; --lampara:#f5b83d; --lampara-suave:#4b3a14; --vidrio:#74c4e6;
  --suelo-madera:#33291d; --suelo-frio:#2a3036; --suelo-rojo:#3b2826;
  --sombra:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--texto);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lampara);outline-offset:2px}
#escena{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;transition:opacity .18s}
#escena.fundido{opacity:0}
#plano{position:absolute;inset:0;width:100%;height:100%;background:var(--mesa);user-select:none}
#etiquetas{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.etq{position:absolute;left:0;top:0;pointer-events:auto;background:var(--papel);border-radius:4px;padding:3px 7px;font-size:12px;font-weight:500;line-height:1.25;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.2);will-change:transform}
.etq small{display:block;font:400 10.5px var(--mono);color:var(--tinta-2)}
.disp{position:absolute;left:0;top:0;pointer-events:auto;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;background:var(--papel);border:1.5px solid var(--linea);box-shadow:0 1px 5px rgba(0,0,0,.25);will-change:transform}
.disp svg{width:17px;height:17px;display:block}
.disp[aria-pressed="true"]{background:var(--lampara);border-color:var(--lampara);color:#1b1405}

.cab{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(330px,calc(100% - 150px));pointer-events:none}
.cab h1{margin:0;font:700 clamp(21px,2.6vw,29px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.cab p{margin:5px 0 0;font:400 11.5px/1.4 var(--mono);color:var(--tinta-2)}
.lista{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1px;background:var(--papel);border-radius:8px;box-shadow:var(--sombra);padding:5px;width:206px}
.lista button{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 9px;border-radius:5px;text-align:left;font-size:13.5px}
.lista button span:last-child{font:400 11.5px var(--mono);color:var(--tinta-2);font-variant-numeric:tabular-nums}
.lista button:hover{background:color-mix(in srgb,var(--linea) 40%,transparent)}
.lista button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);font-weight:600}
.lista button[aria-pressed="true"] span:last-child{color:inherit}
.lista .suma{display:flex;justify-content:space-between;padding:7px 9px 4px;border-top:1px solid var(--linea);margin-top:4px;font:500 11.5px var(--mono);color:var(--tinta-2)}

body.noche:not([data-modo="plano"]) .cab h1,body.noche:not([data-modo="plano"]) .cab p{color:#e9eef1}
.con-panel .lista{display:none}
.modos{position:absolute;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 8px));left:50%;transform:translateX(-50%);display:flex;background:var(--papel);border-radius:9px;box-shadow:var(--sombra);padding:4px;gap:2px}
.modos button{padding:9px 18px;border-radius:6px;font-weight:600;font-size:14px;white-space:nowrap}
.modos button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.mandos{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.mando{background:var(--papel);box-shadow:var(--sombra);border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:500;display:flex;gap:7px;align-items:center;white-space:nowrap}
.mando svg{width:16px;height:16px}
.mando[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}

.panel{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 46px);right:max(16px,env(safe-area-inset-right,0px));width:272px;max-height:calc(100% - 150px);overflow:auto;background:var(--papel);border-radius:10px;box-shadow:var(--sombra);padding:13px 14px}
.panel h2{margin:0;font:700 17px var(--display)}
.panel .aviso{margin:5px 0 10px;font-size:12.5px;line-height:1.4;color:var(--tinta-2)}
.panel h3{margin:12px 0 3px;font:500 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-2)}
.fila{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 0;font-size:13.5px;border-top:1px solid color-mix(in srgb,var(--linea) 55%,transparent);text-align:left}
.fila b{font:500 11.5px var(--mono);color:var(--tinta-2);padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--linea) 35%,transparent);min-width:62px;text-align:center}
.fila[aria-pressed="true"] b{background:var(--lampara);color:#1b1405}
.pista{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 62px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);background:color-mix(in srgb,var(--papel) 90%,transparent);border-radius:6px;padding:5px 11px;font-size:12.5px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.18)}
#joy{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 76px));width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--papel) 55%,transparent);border:1.5px solid var(--linea);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--papel);box-shadow:0 1px 6px rgba(0,0,0,.3)}
/* Plano */
#plano text{font-family:var(--texto);fill:var(--tinta)}
#plano .nom{font-weight:600}
#plano .med{font-family:var(--mono);fill:var(--tinta-2)}
#plano .cota{font-family:var(--mono);fill:var(--tinta-2)}
#plano .sala{cursor:pointer}
#plano .sala:hover rect{filter:brightness(.97)}
#plano .btn{cursor:pointer}

body[data-modo="paseo"] .lista{top:calc(max(14px,env(safe-area-inset-top,0px)) + 40px);transform:none;flex-direction:row;flex-wrap:wrap;width:auto;max-width:calc(100% - 200px);background:none;box-shadow:none;padding:0;gap:5px}
body[data-modo="paseo"] .lista button{background:var(--papel);box-shadow:0 1px 5px rgba(0,0,0,.2);padding:5px 9px;font-size:13px}
body[data-modo="paseo"] .lista button[aria-pressed="true"]{background:var(--tinta)}
body[data-modo="paseo"] .lista button span:last-child,body[data-modo="paseo"] .lista .suma{display:none}
@media (max-width:760px){
  body[data-modo="paseo"] .lista{top:auto;flex-wrap:nowrap;max-width:none;padding:0 max(16px,env(safe-area-inset-left,0px));left:0;right:0;gap:6px}
  .lista{top:auto;transform:none;bottom:calc(max(16px,calc(env(safe-area-inset-bottom,0px) + 8px)) + 54px);left:0;right:0;width:auto;flex-direction:row;overflow-x:auto;background:none;box-shadow:none;padding:0 max(16px,env(safe-area-inset-left,0px));gap:6px;scrollbar-width:none}
  .lista button{flex:none;background:var(--papel);box-shadow:0 1px 5px rgba(0,0,0,.2);padding:6px 10px;font-size:13px}
  .lista button span:last-child,.lista .suma{display:none}
  .pista{bottom:calc(max(16px,calc(env(safe-area-inset-bottom,0px) + 8px)) + 96px);font-size:12px}
  #joy{bottom:calc(max(16px,calc(env(safe-area-inset-bottom,0px) + 8px)) + 134px)}
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(max(16px,calc(env(safe-area-inset-bottom,0px) + 8px)) + 54px);max-height:52%}
  .mando span{display:none}
  .cab p{display:none}
}
</style>

</head>
<body>
<canvas id="escena" tabindex="0" aria-label="Maqueta 3D de la casa"></canvas>
<svg id="plano" hidden role="img" aria-label="Plano de la casa"></svg>
<div id="etiquetas"></div>
<header class="cab">
  <h1>Maqueta del piso</h1>
  <p id="sub">Hecha a partir de los dos vídeos. Medidas estimadas.</p>
</header>
<nav class="lista" id="lista" aria-label="Estancias"></nav>
<div class="mandos">
  <button class="mando" id="btnNoche" aria-pressed="false" title="Cambiar entre día y noche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><span>Noche</span></button>
  <button class="mando" id="btnControles" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Controles</span></button>
</div>
<aside class="panel" id="panel" hidden>
  <h2>Controles</h2>
  <p class="aviso">Simulación. Todavía no hay nada conectado: cada botón cambia solo la maqueta y el plano.</p>
  <div id="filas"></div>
</aside>
<div class="pista" id="pista" hidden></div>
<div id="joy" hidden><i></i></div>
<nav class="modos" aria-label="Vista">
  <button data-modo="maqueta" aria-pressed="true">Maqueta</button>
  <button data-modo="plano" aria-pressed="false">Plano</button>
  <button data-modo="paseo" aria-pressed="false">Paseo</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
"use strict";
/* ======================= DATOS DE LA CASA =======================
   Metros. x crece hacia las ventanas, y crece desde el salón hacia el baño.
   Todo sale de aquí: si cambia una medida, cambian la maqueta, el plano y las colisiones. */
const H=2.5;
const ROOMS=[
 {id:'salon',nombre:'Salón-comedor',rects:[[-.15,-4.2,4.75,-.3],[-.15,-.3,2.6,0]],suelo:'madera',pared:'blanco',medida:'4,90 × 4,20 m',vista:[.75,-.55,142],tinte:'--suelo-madera'},
 {id:'recibidor',nombre:'Recibidor',rects:[[0,.1,1.5,4.4]],suelo:'madera',pared:'blanco',medida:'1,50 × 4,30 m',vista:[.75,3.2,180],tinte:'--suelo-madera'},
 {id:'cocina',nombre:'Cocina',rects:[[1.6,.1,4.75,2.6]],suelo:'baldosa',pared:'beige',medida:'3,15 × 2,50 m',vista:[2.1,.8,70],tinte:'--suelo-frio'},
 {id:'despacho',nombre:'Despacho',rects:[[1.6,2.7,4.75,5.8]],suelo:'madera',pared:'blanco',medida:'3,15 × 3,10 m',vista:[2.0,5.0,105],tinte:'--suelo-madera'},
 {id:'pasillo',nombre:'Pasillo',rects:[[.5,4.5,1.5,7.3]],suelo:'madera',pared:'blanco',medida:'1,00 × 2,80 m',vista:[1,4.8,0],tinte:'--suelo-madera'},
 {id:'dormitorio',nombre:'Dormitorio',rects:[[1.6,5.9,4.75,9.4]],suelo:'madera',pared:'blanco',medida:'3,15 × 3,50 m',vista:[2.0,6.9,55],tinte:'--suelo-madera'},
 {id:'bano',nombre:'Baño',rects:[[-.6,7.4,1.5,10.2]],suelo:'marmol',pared:'rojo',medida:'2,10 × 2,80 m',vista:[1.05,7.75,-28],tinte:'--suelo-rojo'},
];
/* Huecos. hoja: bisagra [x,y], ángulo de la hoja abierta (grados, 0 = hacia +x, 90 = hacia +y). */
const DOORS=[
 {id:'salon',rect:[.1,0,1.4,.1],head:2.1,tipo:'doble',hojas:[{b:[.1,0],a:-92,w:.65,cierra:0},{b:[1.4,0],a:-88,w:.65,cierra:180}]},
 {id:'cocina',rect:[1.5,.3,1.6,1.1],head:2.05,tipo:'cristal',hojas:[{b:[1.5,.3],a:180,w:.8,cierra:90}]},
 {id:'entrada',rect:[-.25,2.6,0,3.5],head:2.05,tipo:'blindada',cerrada:true,hojas:[{b:[0,2.6],a:90,w:.9,cierra:90}]},
 {id:'pasillo',rect:[.6,4.4,1.4,4.5],head:2.05,tipo:'cristal',hojas:[{b:[.6,4.5],a:88,w:.8,cierra:0}]},
 {id:'despacho',rect:[1.5,4.6,1.6,5.4],head:2.05,tipo:'lisa',hojas:[{b:[1.6,5.4],a:2,w:.8,cierra:-90}]},
 {id:'dormitorio',rect:[1.5,6.5,1.6,7.25],head:2.05,tipo:'lisa',hojas:[{b:[1.6,6.5],a:0,w:.75,cierra:90}]},
 {id:'bano',rect:[.7,7.3,1.45,7.4],head:2.05,tipo:'lisa',hojas:[{b:[1.45,7.4],a:92,w:.75,cierra:180}]},
 {id:'balcon',rect:[4.75,.9,5,1.7],head:2.2,tipo:'balcon',cerrada:true,hojas:[{b:[4.75,.9],a:90,w:.8,cierra:90}]},
];
const WINDOWS=[
 {id:'salon',rect:[4.75,-3.05,5,-.7],sill:.12,head:2.25,persiana:'estor',cortina:false,sala:'salon'},
 {id:'cocina',rect:[4.75,1.72,5,2.4],sill:1.0,head:2.2,persiana:'estor',cortina:false,sala:'cocina'},
 {id:'despacho',rect:[4.75,3.45,5,5.05],sill:.95,head:2.2,persiana:'lamas',cortina:true,sala:'despacho'},
 {id:'dormitorio',rect:[4.75,7.55,5,9.2],sill:.95,head:2.2,persiana:'lamas',cortina:true,sala:'dormitorio'},
];
/* Bloques de obra fija: el armario empotrado del pasillo */
const MACIZOS=[[-.15,4.4,.5,7.4]];
const TERRAZA=[5,.55,6,2.05];
/* Dispositivos: la lista que un día apuntará a los aparatos reales */
const DEVICES=[
 ...ROOMS.map(r=>{const c=centro(r);return{id:'luz-'+r.id,tipo:'luz',sala:r.id,nombre:r.nombre,x:c[0],y:c[1],z:H-.05,valor:false}}),
 ...WINDOWS.map(w=>({id:'persiana-'+w.id,tipo:'persiana',sala:w.sala,win:w,nombre:ROOMS.find(r=>r.id===w.sala).nombre,x:w.rect[0]-.25,y:(w.rect[1]+w.rect[3])/2,z:(w.head+w.sill)/2,valor:true})),
];
function centro(r){const a=r.rects[0];return[(a[0]+a[2])/2,(a[1]+a[3])/2]}
function area(r){return r.rects.reduce((s,a)=>s+(a[2]-a[0])*(a[3]-a[1]),0)}
/* Punto de integración futuro: aquí iría la llamada a Home Assistant, MQTT o lo que se use. */
function enviarComando(id,valor){ /* sin conexión todavía */ }

/* ======================= ESTADO E INTERFAZ ======================= */
const $=s=>document.querySelector(s);
let modo='maqueta',salaActiva=null,noche=false,verControles=false,hay3D=false;
const estado=Object.fromEntries(DEVICES.map(d=>[d.id,d.valor]));
const fmtM2=a=>a.toFixed(1).replace('.',',')+' m²';
const ICO={luz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>',
 persiana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16M6 4v16h12V4M6 9h12M6 14h12"/></svg>'};
function textoDisp(d){return d.tipo==='luz'?(estado[d.id]?'Encendida':'Apagada'):(estado[d.id]?'Subida':'Bajada')}

function montarLista(){
  const l=$('#lista');
  l.innerHTML=ROOMS.map(r=>`<button data-sala="${r.id}" aria-pressed="false"><span>${r.nombre}</span><span>${fmtM2(area(r))}</span></button>`).join('')
   +`<div class="suma"><span>Total útil</span><span>≈ ${Math.round(ROOMS.reduce((s,r)=>s+area(r),0))} m²</span></div>`;
  l.addEventListener('click',e=>{const b=e.target.closest('button');if(b)elegirSala(b.dataset.sala)});
  const f=$('#filas');
  f.innerHTML=['luz','persiana'].map(t=>`<h3>${t==='luz'?'Luces':'Persianas'}</h3>`+DEVICES.filter(d=>d.tipo===t).map(d=>`<button class="fila" data-disp="${d.id}"><span>${d.nombre}</span><b></b></button>`).join('')).join('');
  f.addEventListener('click',e=>{const b=e.target.closest('[data-disp]');if(b)alternar(b.dataset.disp)});
  refrescarControles();
}
function refrescarControles(){
  document.querySelectorAll('[data-disp]').forEach(b=>{const d=DEVICES.find(x=>x.id===b.dataset.disp);b.setAttribute('aria-pressed',estado[d.id]);const t=b.querySelector('b');if(t)t.textContent=textoDisp(d);b.title=d.nombre+': '+textoDisp(d)});
}
function alternar(id){
  estado[id]=!estado[id];enviarComando(id,estado[id]);refrescarControles();
  if(hay3D)aplicarDispositivo(DEVICES.find(d=>d.id===id));
  if(modo==='plano')dibujarPlano();
}
function elegirSala(id){
  salaActiva=id;
  document.querySelectorAll('#lista button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sala===id));
  if(modo==='plano')return setModo('paseo',id);
  if(modo==='paseo'&&hay3D)colocarEn(id);
  if(modo==='maqueta'&&hay3D)volarASala(id);
}
function setModo(m,sala){
  if(!hay3D&&m!=='plano')m='plano';
  modo=m;document.body.dataset.modo=m;
  document.querySelectorAll('.modos button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===m));
  try{history.replaceState(null,'','#'+m)}catch(_){location.hash=m}
  $('#plano').toggleAttribute('hidden',m!=='plano');
  $('#escena').style.visibility=m==='plano'?'hidden':'visible';
  if(m==='plano')dibujarPlano();
  $('#pista').hidden=m!=='paseo';
  if(m==='paseo')$('#pista').textContent=matchMedia('(pointer:coarse)').matches?'Arrastra para mirar. Usa el mando para andar o toca el suelo.':'Arrastra para mirar. WASD o flechas para andar, o haz clic en el suelo.';
  $('#joy').hidden=!(m==='paseo'&&matchMedia('(pointer:coarse)').matches);
  $('#sub').hidden=m==='paseo';
  if(hay3D){entrarModo3D(m,sala);moverEtiquetas()}
}

  etqs.forEach(e=>{e.el.hidden=!mostrarEtq;if(mostrarEtq){vv.copy(e.v).project(cam);e.el.style.transform=`translate(-50%,-50%) translate(${(vv.x+1)/2*w}px,${(1-vv.y)/2*h}px)`}});
  const mostrar=vis&&verControles;
  disps.forEach(e=>{e.el.hidden=!mostrar;if(mostrar){vv.copy(e.v).project(cam);e.el.style.transform=`translate(${(vv.x+1)/2*w}px,${(1-vv.y)/2*h}px)`}});
}
/* --- Paseo en primera persona --- */
const yo={x:.75,y:3.2,yaw:Math.PI,pitch:-.03,obj:null};
const teclas={},joy={x:0,y:0};
function libre(x,y){
  const r=.17;
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
    const enSala=ROOMS.some(s=>s.rects.some(q=>px>=q[0]&&px<=q[2]&&py>=q[1]&&py<=q[3]));
    const enPuerta=DOORS.some(d=>!d.cerrada&&px>=d.rect[0]&&px<=d.rect[2]&&py>=d.rect[1]-.01&&py<=d.rect[3]+.01);
    if(!enSala&&!enPuerta)return false;
    if(HUELLAS.some(h=>h.solido&&px>h.x0&&px<h.x1&&py>h.y0&&py<h.y1))return false;
  }
  return true;
}
function colocarEn(id){
  const r=ROOMS.find(x=>x.id===id),v=r.vista;
  yo.x=v[0];yo.y=v[1];yo.yaw=THREE.MathUtils.degToRad(v[2]);yo.pitch=-.04;yo.obj=null;actualizarCam();pedirRender();
}
function actualizarCam(){
  cam.position.set(yo.x,1.52,-yo.y);
  /* yaw 0 mira hacia +y del plano, 90 hacia +x */
  const cp=Math.cos(yo.pitch);
  cam.lookAt(yo.x+Math.sin(yo.yaw)*cp,1.52+Math.sin(yo.pitch),-(yo.y+Math.cos(yo.yaw)*cp));
}
function intentar(dx,dy){
  let mov=false;
  if(libre(yo.x+dx,yo.y+dy)){yo.x+=dx;yo.y+=dy;mov=true}
  else{if(libre(yo.x+dx,yo.y)){yo.x+=dx;mov=true}else if(libre(yo.x,yo.y+dy)){yo.y+=dy;mov=true}}
  return mov;
}
let tPrev=0;
function pasoFrame(t){
  const dt=Math.min(.12,(t-tPrev)/1000);tPrev=t;
  let av=(teclas.w?1:0)-(teclas.s?1:0)-joy.y,la=(teclas.d?1:0)-(teclas.a?1:0)+joy.x,gi=(teclas.der?1:0)-(teclas.izq?1:0),mov=false;
  if(gi){yo.yaw+=gi*1.7*dt;mov=true}
  if(av||la){yo.obj=null;const v=1.7*dt,s=Math.sin(yo.yaw),c=Math.cos(yo.yaw);if(intentar((s*av+c*la)*v,(c*av-s*la)*v))mov=true}
  else if(yo.obj){const dx=yo.obj[0]-yo.x,dy=yo.obj[1]-yo.y,d=Math.hypot(dx,dy);
    if(d<.07)yo.obj=null;else{const v=Math.min(d,1.9*dt);if(intentar(dx/d*v,dy/d*v))mov=true;else yo.obj=null}}
  if(mov||dirty)actualizarCam();
  return mov;
}
function iniciarPaseo(){
  const cv=$('#escena');
  let ptr=null,lx,ly,mov=0;
  cv.addEventListener('pointerdown',e=>{if(modo!=='paseo')return;cv.focus({preventScroll:true});ptr=e.pointerId;lx=e.clientX;ly=e.clientY;mov=0;cv.setPointerCapture(ptr)});
  cv.addEventListener('pointermove',e=>{if(modo!=='paseo'||e.pointerId!==ptr)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;mov+=Math.abs(dx)+Math.abs(dy);yo.yaw-=dx*.0042;yo.pitch=Math.max(-1.2,Math.min(1.2,yo.pitch+dy*.0034));actualizarCam();pedirRender()});
  const ray=new THREE.Raycaster(),plano=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();
  cv.addEventListener('pointerup',e=>{if(e.pointerId!==ptr)return;ptr=null;if(modo!=='paseo'||mov>8)return;
    ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight*2-1)},cam);
    if(ray.ray.intersectPlane(plano,pt)&&pt.distanceTo(cam.position)<9)yo.obj=[pt.x,-pt.z];});
  cv.addEventListener('pointercancel',()=>{ptr=null});
  const mapa={KeyW:'w',ArrowUp:'w',KeyS:'s',ArrowDown:'s',KeyA:'a',KeyD:'d',ArrowLeft:'izq',ArrowRight:'der'};
  addEventListener('keydown',e=>{if(modo!=='paseo')return;const k=mapa[e.code];if(k){teclas[k]=true;e.preventDefault()}});
  addEventListener('keyup',e=>{const k=mapa[e.code];if(k)teclas[k]=false});
  addEventListener('blur',()=>{for(const k in teclas)teclas[k]=false});
  const J=$('#joy'),pomo=J.firstElementChild;let jp=null;
  const jm=e=>{const b=J.getBoundingClientRect(),R=b.width/2;let x=(e.clientX-b.left-R)/R,y=(e.clientY-b.top-R)/R;const n=Math.hypot(x,y);if(n>1){x/=n;y/=n}joy.x=x;joy.y=y;pomo.style.transform=`translate(${x*R*.6}px,${y*R*.6}px)`};
  J.addEventListener('pointerdown',e=>{jp=e.pointerId;J.setPointerCapture(jp);jm(e)});
  J.addEventListener('pointermove',e=>{if(e.pointerId===jp)jm(e)});
  const jf=e=>{if(e.pointerId===jp){jp=null;joy.x=joy.y=0;pomo.style.transform=''}};
  J.addEventListener('pointerup',jf);J.addEventListener('pointercancel',jf);
}

/* ======================= PLANO 2D =======================
   Se dibuja desde los mismos datos. Tumbado en pantallas anchas, de pie en las estrechas. */
function dibujarPlano(){
  const svg=$('#plano');
  const w=innerWidth,h=innerHeight,tumbado=w>h*1.05;
  const M=(x,y)=>tumbado?[y*100,x*100]:[x*100,-y*100];
  const R=(a)=>{const[p,q]=[M(a[0],a[1]),M(a[2],a[3])];return{x:Math.min(p[0],q[0]),y:Math.min(p[1],q[1]),w:Math.abs(p[0]-q[0]),h:Math.abs(p[1]-q[1])}};
  const rc=(a,attrs)=>{const r=R(a);return`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" ${attrs}/>`};
  /* límites */
  let xs=[],ys=[];MUROS.forEach(a=>{xs.push(a[0],a[2]);ys.push(a[1],a[3])});xs.push(TERRAZA[2]);
  const a0=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
  const b=R(a0);
  /* márgenes para cotas e interfaz: en vertical, la lista y el mando ocupan la parte baja */
  const peq=w<=760;
  const conP=verControles&&!peq;const mgIzq=peq?78:(conP?76:300),mgDer=peq?30:(conP?312:40),mgSup=peq?90:92,mgInf=peq?(verControles?h*.58:150):92;
  const dispW=w-mgIzq-mgDer,dispH=h-mgSup-mgInf,esc=Math.min(dispW/b.w,dispH/b.h);
  const vbW=w/esc,vbH=h/esc,vx=b.x-mgIzq/esc-(dispW/esc-b.w)/2,vy=b.y-mgSup/esc-(dispH/esc-b.h)/2;
  svg.setAttribute('viewBox',`${vx} ${vy} ${vbW} ${vbH}`);
  const u=1/esc; /* 1 px de pantalla en unidades de plano */
  const tinta=css('--tinta'),muro=css('--muro'),linea=css('--linea'),tin2=css('--tinta-2'),vid=css('--vidrio'),lam=css('--lampara'),pap=css('--papel');
  let o='';
  /* terraza */
  const tr=R(TERRAZA);o+=`<rect x="${tr.x}" y="${tr.y}" width="${tr.w}" height="${tr.h}" fill="none" stroke="${tin2}" stroke-width="${1.2*u}" stroke-dasharray="${5*u} ${4*u}"/>`;
  /* salas */
  ROOMS.forEach(r=>{const act=salaActiva===r.id;o+=`<g class="sala" data-sala="${r.id}" role="button" aria-label="Pasear por ${r.nombre}">`+r.rects.map(a=>{const q=R(a);return`<rect x="${q.x}" y="${q.y}" width="${q.w+.2}" height="${q.h+.2}" fill="var(${r.tinte})"/>`}).join('')+'</g>'});
  /* muebles */
  HUELLAS.forEach(f=>{const a=[f.x0,f.y0,f.x1,f.y1],q=R(a);
    if(f.forma==='mesaRedonda'){const c=M((f.x0+f.x1)/2,(f.y0+f.y1)/2);o+=`<circle cx="${c[0]}" cy="${c[1]}" r="${q.w/2}" fill="${pap}" stroke="${tin2}" stroke-width="${1*u}"/>`}
    else if(f.forma==='ducha'){o+=`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${pap}" stroke="${tin2}" stroke-width="${1*u}"/>`;const p1=M(f.x0,f.y0),p2=M(f.x1,f.y1),p3=M(f.x0,f.y1),p4=M(f.x1,f.y0);o+=`<path d="M${p1}L${p2}M${p3}L${p4}" stroke="${linea}" stroke-width="${1*u}"/>`}
    else if(f.forma==='armario'){const p1=M(f.x0,f.y0),p2=M(f.x1,f.y1),p3=M(f.x0,f.y1),p4=M(f.x1,f.y0);o+=`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${pap}" stroke="${tin2}" stroke-width="${1*u}"/><path d="M${p1}L${p2}M${p3}L${p4}" stroke="${linea}" stroke-width="${1*u}"/>`}
    else if(f.forma==='rad'){o+=`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${tin2}"/>`}
    else if(f.forma!=='pilar')o+=`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${pap}" stroke="${tin2}" stroke-width="${.9*u}" ${f.forma==='cama'||f.forma==='sofa'?`rx="${4}"`:''}/>`;
  });
  /* armario empotrado del pasillo */
  const am=[-.15,4.5,.5,7.3];const qa=R(am);o+=`<rect x="${qa.x}" y="${qa.y}" width="${qa.w}" height="${qa.h}" fill="${pap}" stroke="${tin2}" stroke-width="${1*u}"/>`;
  {const p1=M(am[0],am[1]),p2=M(am[2],am[3]),p3=M(am[0],am[3]),p4=M(am[2],am[1]);o+=`<path d="M${p1}L${p2}M${p3}L${p4}" stroke="${linea}" stroke-width="${1*u}"/>`}
  /* muros: poché */
  const macs=MACIZOS.map(m=>[m[0],m[1],m[2],4.5]).concat(MACIZOS.map(m=>[m[0],7.3,m[2],m[3]]));
  MUROS.forEach(a=>{const dentro=a[0]>=-.151&&a[2]<=.501&&a[1]>=4.499&&a[3]<=7.301;if(!dentro)o+=rc(a,`fill="${muro}"`)});
  /* ventanas */
  WINDOWS.forEach(v=>{const q=R(v.rect);o+=`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${pap}" stroke="${vid}" stroke-width="${1*u}"/>`;
    const[x0,y0,x1,y1]=v.rect,mx=(x0+x1)/2,p=M(mx,y0),e=M(mx,y1);o+=`<path d="M${p}L${e}" stroke="${vid}" stroke-width="${2*u}"/>`});
  /* puertas */
  DOORS.forEach(d=>{
    o+=rc(d.rect,`fill="var(--mesa)"`);
    const fila=d.tipo==='balcon'||d.tipo==='blindada';
    d.hojas.forEach(hj=>{const a=d.cerrada?hj.cierra+(d.tipo==='blindada'?0:0):hj.a,ar=THREE_rad(a),cr=THREE_rad(hj.cierra),h0=M(hj.b[0],hj.b[1]),e=M(hj.b[0]+Math.cos(ar)*hj.w,hj.b[1]+Math.sin(ar)*hj.w),c=M(hj.b[0]+Math.cos(cr)*hj.w,hj.b[1]+Math.sin(cr)*hj.w);
      const col=d.tipo==='blindada'?'#1f3a30':tinta;
      if(d.cerrada){o+=`<path d="M${h0}L${c}" stroke="${d.tipo==='blindada'?col:vid}" stroke-width="${3.2*u}"/>`;return}
      const cross=(e[0]-h0[0])*(c[1]-h0[1])-(e[1]-h0[1])*(c[0]-h0[0]),sw=cross>0?1:0,r=hj.w*100;
      o+=`<path d="M${e[0]} ${e[1]}A${r} ${r} 0 0 ${sw} ${c[0]} ${c[1]}" fill="none" stroke="${tin2}" stroke-width="${.8*u}"/><path d="M${h0}L${e}" stroke="${tinta}" stroke-width="${2.4*u}"/>`;
    });
  });
  /* etiquetas */
  const POS={salon:[1.75,-1.95],recibidor:[.75,3.2],cocina:[3.1,1.58],despacho:[2.55,4.4],pasillo:[1.0,6.0],dormitorio:[3.1,6.95],bano:[.62,8.55]};
  const t1=Math.max(13.5*u,18),t2=Math.max(11*u,15);
  const halo=`paint-order="stroke" stroke-width="${3.5*u}" stroke-linejoin="round"`;
  ROOMS.forEach(r=>{const p=M(...POS[r.id]);
    const col=`var(${r.tinte})`;
    o+=`<g class="btn" data-sala="${r.id}" role="button"><text class="nom" x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="${t1}" stroke="${col}" ${halo}>${r.nombre}</text><text class="med" x="${p[0]}" y="${p[1]+t2*1.3}" text-anchor="middle" font-size="${t2*.92}" stroke="${col}" ${halo}>${fmtM2(area(r))}</text><title>${r.nombre}: ${r.medida}</title></g>`});
  const t=M(5.5,1.3);o+=`<text class="med" x="${t[0]}" y="${t[1]}" text-anchor="middle" font-size="${t2*.85}">Terraza</text><text class="med" x="${t[0]}" y="${t[1]+t2}" text-anchor="middle" font-size="${t2*.8}">sin ver</text>`;
  /* cotas totales */
  const lx=(a,bb,txt)=>{const m=[(a[0]+bb[0])/2,(a[1]+bb[1])/2],ang=Math.abs(a[0]-bb[0])<1?-90:0;
    return`<path d="M${a}L${bb}" stroke="${tin2}" stroke-width="${1*u}"/><path d="M${a[0]-3*u} ${a[1]+3*u}l${6*u} ${-6*u}M${bb[0]-3*u} ${bb[1]+3*u}l${6*u} ${-6*u}" stroke="${tin2}" stroke-width="${1*u}"/><text class="cota" font-size="${t2}" text-anchor="middle" transform="translate(${m[0]},${m[1]-6*u}) rotate(${ang})">${txt}</text>`};
  const X0=-.15,X1=4.75,Y0=-4.2,Y1=10.2,sep=24*u;
  if(tumbado){const yy=b.y-sep;o+=lx([Y0*100,yy],[Y1*100,yy],'14,40 m');const xx=b.x-sep;o+=lx([xx,X0*100],[xx,X1*100],'4,90 m')}
  else{const yy=b.y-sep;o+=lx([X0*100,yy],[X1*100,yy],'4,90 m');const xx=b.x-sep;o+=lx([xx,-Y1*100],[xx,-Y0*100],'14,40 m')}
  /* barra de escala */
  const ex=tumbado?b.x+b.w-200:b.x,ey=b.y+b.h+Math.max(26*u,30);
  o+=`<rect x="${ex}" y="${ey}" width="100" height="${5*u}" fill="${tinta}"/><rect x="${ex+100}" y="${ey}" width="100" height="${5*u}" fill="none" stroke="${tinta}" stroke-width="${1*u}"/>`;
  [0,1,2].forEach(n=>o+=`<text class="cota" x="${ex+n*100}" y="${ey-5*u}" text-anchor="middle" font-size="${t2*.85}">${n}${n===2?' m':''}</text>`);
  /* dispositivos */
  if(verControles){
    DEVICES.forEach(d=>{const off=d.tipo==='luz'?{luz:1}:null;const pos=d.tipo==='luz'?(POS_DISP[d.sala]||[d.x,d.y]):[d.win.rect[0]-.28,(d.win.rect[1]+d.win.rect[3])/2];const c=M(pos[0],pos[1]),r=Math.max(14*u,17),on=estado[d.id];
      const s=r*1.25;o+=`<g class="btn" data-disp="${d.id}" role="button" aria-label="${d.tipo} ${d.nombre}"><circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="${on?lam:pap}" stroke="${on?lam:tin2}" stroke-width="${1.2*u}"/><svg x="${c[0]-s/2}" y="${c[1]-s/2}" width="${s}" height="${s}" style="color:${on?'#1b1405':tinta}">${ICO[d.tipo].replace(/^<svg/,'<svg width="100%" height="100%"')}</svg></g>`});
  }
  svg.innerHTML=o;
}
const POS_DISP={salon:[.35,-1.3],recibidor:[.75,1.7],cocina:[1.95,1.5],despacho:[1.95,3.6],pasillo:[1,5],dormitorio:[1.95,8.0],bano:[.95,9.1]};
const THREE_rad=d=>d*Math.PI/180;
$('#plano').addEventListener('click',e=>{
  const dv=e.target.closest('[data-disp]');if(dv)return alternar(dv.dataset.disp);
  const s=e.target.closest('[data-sala]');if(s)elegirSala(s.dataset.sala);

function arrancar(){

  if(ok){try{construir3D();hay3D=true}catch(err){console.error(err);ok=false}}
